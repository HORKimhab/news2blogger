[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "news2blogger"
version = "0.1.0"
description = "Summarize and translate attributed articles into Blogger drafts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "cryptography>=44,<51",
  "feedparser>=6.0,<7",
  "google-api-python-client>=2.160,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "markdown>=3.7,<4",
  "openai>=1.68,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
news2blogger = "news2blogger.cli:main"
news2blogger-env = "news2blogger.env_crypto:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
